nav:
  - 首页: index.md

  - 文档:
      - 文档首页: guide/index.md
      - 安装教程: guide/installation.md
      - 常见问题: guide/faq.md

  - 模组列表: mods/list.md
site_name: 帕帕拉恰的兽人星露谷合集包文档
site_url: https://hychan2333.github.io/Furrydocs
theme:
  logo: assets/logo.png
  favicon: assets/images/favicon.png
  name: material
  palette:
    scheme: default
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
plugins:
  - search:
        separator: '[\s\u200b\-]'
        lang:
            - zh
            - en
  - social:
        enabled: !ENV [CI, false]
markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
extra_css:
  - stylesheets/extra.css
extra:
   alternate:
      - name: "English"
        link: "/en/"
        lang: "en"
      - name: "简体中文"
        link: "/zh/"
        lang: "zh"
